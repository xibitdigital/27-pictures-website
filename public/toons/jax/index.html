<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Jax | Experiments | 27 Pictures</title>
    <meta
      name="description"
      content="Jax — interactive cyberpunk toon with multilingual captions (EN/IT/DE/FR) from 27 Pictures Experiments."
    />
    <link rel="canonical" href="https://twentyseven.pictures/toons/jax/" />

    <link rel="icon" type="image/png" href="../../logosquare.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../../logosquare.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&family=VT323&family=Playfair+Display:ital,wght@0,900;1,900&family=Inter:wght@300;400;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../styles.css?v=db029ea008" />
    <link rel="stylesheet" href="../reader-shared.css?v=d69888c83e" />
    <style>
      /* Book-only tokens — portrait pages (1008×1792). Shared reader shell
         chrome lives in ../reader-shared.css; this block only has Jax's own
         book-aspect tokens and Jax-only extras (word captions, language
         switcher, sound/music buttons). */
      :root {
        /* Spread aspect ≈ 0.89 (two 1008×1792 pages). Prefer height-fill.
           Leave ~56px total for side page-nav buttons so they never stick
           past the viewport (that overflow caused a resizing black band). */
        --book-width: min(calc(100vw - 56px), 1200px, calc((100dvh - 160px) / 0.89));
        --book-height: calc(var(--book-width) * 0.89);
        --page-bg: #0a0a0c;
        --spine: #1a1a22;
        --cover: #0a0a0c;
      }

      body.is-fullscreen .book-scene {
        --book-width: min(calc(100vw - 24px), calc(92dvh / 0.89));
        --book-height: min(88dvh, calc(var(--book-width) * 0.89));
        width: var(--book-width);
        height: var(--book-height);
      }

      body.is-fullscreen.single-page .book-scene {
        --book-width: min(94vw, calc(88dvh * 0.562));
        --book-height: min(88dvh, calc(var(--book-width) * 1.778));
      }

      body.single-page {
        --book-width: min(97vw, 520px);
        --book-height: min(84dvh, calc(var(--book-width) * 1.778));
      }

      /* Language dropdown — only the selected code is visible; menu opens on click */
      .jax-lang-switcher {
        display: flex;
        align-items: center;
      }

      .jax-lang-dropdown {
        position: relative;
      }

      .jax-lang-toggle {
        min-width: 2.4rem;
        gap: 0.2rem;
        padding: 0.45rem 0.4rem;
        font-size: 0.7rem;
        letter-spacing: 0.08em;
      }

      .jax-lang-toggle-label {
        font-family: "Inter", sans-serif;
        font-weight: 700;
        text-transform: uppercase;
        line-height: 1;
      }

      .jax-lang-chevron {
        width: 9px;
        height: 9px;
        flex-shrink: 0;
        opacity: 0.75;
        transition: transform 0.18s var(--transition);
      }

      .jax-lang-dropdown.is-open .jax-lang-toggle {
        border-color: var(--red-smile);
        color: var(--red-smile);
      }

      .jax-lang-dropdown.is-open .jax-lang-chevron {
        transform: rotate(180deg);
        opacity: 1;
      }

      .jax-lang-menu {
        position: absolute;
        top: calc(100% + 0.35rem);
        right: 0;
        z-index: 60;
        display: flex;
        flex-direction: column;
        min-width: 100%;
        background: var(--bg-card);
        border: 1px solid var(--border-light);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
      }

      .jax-lang-menu[hidden] {
        display: none !important;
      }

      .jax-lang-option {
        font-family: "Inter", sans-serif;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--silver);
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--border);
        padding: 0.55rem 0.75rem;
        cursor: pointer;
        text-align: center;
        transition:
          color 0.15s var(--transition),
          background 0.15s var(--transition);
      }

      .jax-lang-option:last-child {
        border-bottom: none;
      }

      .jax-lang-option:hover {
        color: var(--text);
        background: var(--bg);
      }

      .jax-lang-option.is-active {
        color: var(--red-smile);
      }

      .jax-lang-option:focus-visible {
        outline: 2px solid var(--red-smile);
        outline-offset: -2px;
      }

      .jax-word-layer,
      .jax-word,
      .jax-word-text {
        font-family: "Bangers", cursive;
        font-weight: 400;
        text-transform: uppercase;
      }

      /* Base placement/rotation comes from --jax-transform (set inline per
         word); kept out of the `transform` shorthand itself so the hover
         rule below can append scale() without clobbering position. */
      .jax-word {
        transform: var(--jax-transform);
      }

      .jax-word--sfx {
        transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1);
        transform-origin: center;
      }

      .jax-word--sfx:hover {
        transform: var(--jax-transform) scale(1.22);
      }

      /* Sketchy dialog bubble variant */
      .jax-word--bubble {
        display: inline-block;
        position: absolute;
        max-width: inherit;
      }

      .jax-word--bubble .jax-bubble-svg {
        /* width/height are definite (100%) so the box always tracks the text
           box's actual aspect ratio — leaving them "auto" makes browsers fall
           back to the viewBox's intrinsic 1:1 ratio and force a square box.
           Tail/scratch coordinates outside the 0–100 viewBox still bleed past
           this box because overflow stays visible. */
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        overflow: visible;
        pointer-events: none;
      }

      .jax-word--bubble .jax-word-text {
        position: relative;
        z-index: 1;
        display: block;
        white-space: pre-line;
      }

      .jax-word--ai .jax-word-text {
        font-family: "VT323", monospace;
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        text-align: center;
      }

      #soundBtn.is-enabled,
      #musicBtn.is-enabled {
        border-color: var(--red-smile);
        color: var(--red-smile);
      }

      #soundBtn #soundWaves {
        display: none;
      }

      #soundBtn.is-enabled #soundWaves {
        display: inline;
      }

      /* Vertical strip width is set in reader-shared.css (not --book-width). */
    </style>
  </head>
  <body class="toons-reader">
    <audio
      id="bgMusic"
      src="assets/music/990f5db70e833cdaa0a411a9f0025275.mp3"
      loop
      preload="none"
      aria-hidden="true"
    ></audio>

    <div
      id="soundPrompt"
      class="sound-prompt"
      role="dialog"
      aria-modal="true"
      aria-labelledby="soundPromptTitle"
      hidden
    >
      <div class="sound-prompt__panel">
        <svg
          class="sound-prompt__icon"
          width="40"
          height="40"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          aria-hidden="true"
        >
          <path d="M4 9v6h4l5 4V5L8 9H4z" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <h2 id="soundPromptTitle">Enable sound</h2>
        <p>This caption has audio. Turn sound on to hear dialogue, onomatopoeia, and SFX.</p>
        <div class="sound-prompt__actions">
          <button type="button" id="soundPromptEnable" class="sound-prompt__btn sound-prompt__btn--primary">
            Enable sound
          </button>
          <button type="button" id="soundPromptDismiss" class="sound-prompt__btn">Not now</button>
        </div>
      </div>
    </div>

    <a href="/experiments/" class="toons-back" title="Back to Experiments" aria-label="Back to Experiments">
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path d="M19 12H5M11 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </a>
    <div class="toon-top-controls">
      <div id="langSwitcher" class="jax-lang-switcher"></div>
      <button
        type="button"
        id="soundBtn"
        class="toon-fs-btn"
        aria-pressed="false"
        title="Enable sound effects"
        aria-label="Enable sound effects"
      >
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M4 9v6h4l5 4V5L8 9H4z" stroke-linecap="round" stroke-linejoin="round" />
          <path
            id="soundWaves"
            d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span class="toon-fs-label" id="soundBtnLabel">Sound</span>
      </button>
      <button
        type="button"
        id="viewModeBtn"
        class="toon-fs-btn"
        aria-pressed="false"
        title="Switch to vertical scroll view"
        aria-label="Switch to vertical scroll view"
      >
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M4 6h16M4 12h16M4 18h10" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="toon-fs-label" id="viewModeLabel">Scroll</span>
      </button>
      <button
        type="button"
        id="musicBtn"
        class="toon-fs-btn"
        aria-pressed="false"
        title="Play music"
        aria-label="Play music"
      >
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path
            d="M9 18V5l10-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm10-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span class="toon-fs-label" id="musicBtnLabel">Music</span>
      </button>
      <button
        type="button"
        id="fullscreenBtn"
        class="toon-fs-btn"
        aria-pressed="false"
        title="Fullscreen"
        aria-label="Enter fullscreen"
      >
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="toon-fs-label">Full</span>
      </button>
    </div>

    <main class="reader" id="main-content" role="main">
      <div class="book-scene">
        <div class="book-shadow"></div>
        <div class="book" id="book">
          <div class="spread" id="spread">
            <div class="page-slot left" id="slot-left"></div>
            <div class="page-slot right" id="slot-right"></div>
            <div class="spine-glow"></div>
            <div class="spine"></div>
            <div class="nav-zone next" id="zone-next" title="Next page"></div>
            <div class="nav-zone prev" id="zone-prev" title="Previous page"></div>
          </div>
        </div>
        <button
          class="reader-btn page-nav-btn prev"
          id="btn-prev"
          type="button"
          title="Previous page"
          aria-label="Previous page"
        >
          &#8592;
        </button>
        <button
          class="reader-btn page-nav-btn next"
          id="btn-next"
          type="button"
          title="Next page"
          aria-label="Next page"
        >
          &#8594;
        </button>
      </div>

      <div class="controls">
        <span class="page-indicator" id="indicator" aria-live="polite">…</span>
      </div>

      <div id="verticalStrip" class="vertical-strip" aria-label="Vertical page scroll" hidden></div>
    </main>

    <script src="../book-reader.js?v=2416b7d502"></script>
    <script src="../view-mode.js?v=73a009f9e0"></script>
    <script src="words.js?v=1d23405488"></script>
    <script>
      let wordOverlay = null;
      let viewMode = null;

      window.__jaxSoundEnabled = false;

      (function () {
        // Two buttons can toggle sound: the top-bar #soundBtn (static) and
        // .front-cover-sound-btn (recreated every time the front cover
        // re-renders). Event delegation on document covers both regardless
        // of when/whether either exists in the DOM at a given moment.
        //
        // Sound prompt: only the first caption hover/tap while sound is off
        // this page load. Resets on reload (in-memory flag only).
        let soundPromptShown = false;

        function hasShownSoundPrompt() {
          return soundPromptShown;
        }

        function markSoundPromptShown() {
          soundPromptShown = true;
        }

        function setSoundEnabled(enabled) {
          window.__jaxSoundEnabled = enabled;
          document.querySelectorAll("#soundBtn, .front-cover-sound-btn").forEach((btn) => {
            btn.classList.toggle("is-enabled", enabled);
            btn.setAttribute("aria-pressed", String(enabled));
            btn.title = enabled ? "Mute sound" : "Enable sound";
            btn.setAttribute("aria-label", btn.title);
            const span = btn.querySelector("span");
            if (span) {
              if (!btn.dataset.offLabel) btn.dataset.offLabel = span.textContent;
              span.textContent = enabled ? "Sound on" : btn.dataset.offLabel;
            }
          });
          if (enabled) {
            // The click itself is a real user gesture — play a confirmation
            // tone so enabling is audibly obvious (and proves audio output
            // works before the user starts hovering word captions).
            const confirm = new Audio("assets/sfx/83f9d2254039840ee2c9c109bc8eb2fb.mp3");
            confirm.play().catch(() => {});
            hideSoundPrompt();
            markSoundPromptShown();
          }
        }

        window.__jaxSetSoundEnabled = setSoundEnabled;

        function hideSoundPrompt() {
          const prompt = document.getElementById("soundPrompt");
          if (prompt) prompt.hidden = true;
        }

        /**
         * Called from words.js when the user interacts with a caption that
         * has audio but sound is still off. First time only this session.
         */
        window.__jaxMaybePromptSound = function maybePromptSound() {
          if (window.__jaxSoundEnabled) return;
          if (hasShownSoundPrompt()) return;
          const prompt = document.getElementById("soundPrompt");
          if (!prompt || !prompt.hidden) return;
          markSoundPromptShown();
          prompt.hidden = false;
          const enable = document.getElementById("soundPromptEnable");
          if (enable) enable.focus();
        };

        document.addEventListener("click", (ev) => {
          const target = ev.target.closest("#soundBtn, .front-cover-sound-btn");
          if (!target) return;
          setSoundEnabled(!window.__jaxSoundEnabled);
        });

        const enableBtn = document.getElementById("soundPromptEnable");
        const dismissBtn = document.getElementById("soundPromptDismiss");
        if (enableBtn) {
          enableBtn.addEventListener("click", () => {
            setSoundEnabled(true);
          });
        }
        if (dismissBtn) {
          dismissBtn.addEventListener("click", () => {
            markSoundPromptShown();
            hideSoundPrompt();
          });
        }

        document.addEventListener("keydown", (ev) => {
          if (ev.key !== "Escape") return;
          const prompt = document.getElementById("soundPrompt");
          if (prompt && !prompt.hidden) {
            markSoundPromptShown();
            hideSoundPrompt();
          }
        });
      })();

      (function () {
        const btn = document.getElementById("musicBtn");
        const label = document.getElementById("musicBtnLabel");
        const music = document.getElementById("bgMusic");
        if (!btn || !music) return;
        music.volume = 0.22;
        let enabled = false;
        btn.addEventListener("click", () => {
          enabled = !enabled;
          btn.classList.toggle("is-enabled", enabled);
          btn.setAttribute("aria-pressed", String(enabled));
          btn.title = enabled ? "Pause music" : "Play music";
          btn.setAttribute("aria-label", btn.title);
          if (label) label.textContent = enabled ? "Music on" : "Music";
          if (enabled) music.play().catch(() => {});
          else music.pause();
        });
      })();

      viewMode = ToonViewMode.init({
        altPrefix: "Jax",
        mobileDefault: true,
        onPagePaint(slot, pageNum) {
          if (wordOverlay) wordOverlay.render(slot, pageNum);
        },
        onEnterScroll(strip) {
          if (wordOverlay && strip) wordOverlay.refreshAll(strip);
        },
        onEnterBook() {
          if (wordOverlay) wordOverlay.refreshAll(document.getElementById("book"));
        },
      });

      ToonBook.init({
        altPrefix: "Jax",
        frontCoverLogo: "../../logosquare.png",
        coverTexture: "/toons/assets/3d2d90aafc6ae28a9cb9f841a3b7183f.jpg",
        onPagePaint(slot, pageNum) {
          if (wordOverlay) wordOverlay.render(slot, pageNum);
        },
        onPageClear(slot) {
          if (wordOverlay) wordOverlay.render(slot, null);
        },
        afterFullscreen() {
          if (!wordOverlay) return;
          if (viewMode && viewMode.isVertical()) {
            const strip = viewMode.getStrip();
            if (strip) wordOverlay.refreshAll(strip);
          } else {
            wordOverlay.refreshAll(document.getElementById("book"));
          }
        },
        async beforeStart() {
          const wordsConfig = await window.JaxToon.loadWords("words.json");
          wordOverlay = new window.JaxToon.WordOverlay(wordsConfig);
          window.JaxToon.mountLangSwitcher(document.getElementById("langSwitcher"), wordOverlay, () => {
            if (viewMode && viewMode.isVertical()) {
              const strip = viewMode.getStrip();
              if (strip) wordOverlay.refreshAll(strip);
            } else {
              wordOverlay.refreshAll(document.getElementById("book"));
            }
          });
          // Mobile may have entered scroll before words loaded — paint captions now.
          if (viewMode && viewMode.isVertical()) viewMode.refreshStrip();
        },
      });
    </script>
  </body>
</html>
