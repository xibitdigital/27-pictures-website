<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Erin | Experiments | 27 Pictures</title>
    <meta name="description" content="Erin — an interactive page-turning manga reader from 27 Pictures Experiments." />
    <link rel="canonical" href="https://twentyseven.pictures/toons/erin/" />

    <link rel="icon" type="image/png" href="../../logosquare.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../../logosquare.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,900&family=Inter:wght@300;400;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../styles.css?v=db029ea008" />
    <link rel="stylesheet" href="../reader-shared.css?v=d69888c83e" />
    <style>
      /* Book-only tokens (page paper / spine — not site chrome). Shared
         reader shell chrome lives in ../reader-shared.css; this block only
         has Erin's own book-aspect tokens. */
      :root {
        /* Spread aspect ≈ 0.75 (two 1152×1728 pages side by side).
           Prefer height-fill like Jax: Erin is flatter, so it needs a wider
           max width to reach the same on-screen height (was 900px / 0.72 and
           looked noticeably smaller than Jax). */
        /* Leave room for side page-nav buttons (see Jax note). */
        --book-width: min(calc(100vw - 56px), 1200px, calc((100dvh - 160px) / 0.75));
        --book-height: calc(var(--book-width) * 0.75);
        --page-bg: #f8f4ec;
        --spine: #2a2218;
        --cover: #111;
      }

      body.is-fullscreen .book-scene {
        --book-width: min(calc(100vw - 24px), calc(92dvh / 0.75));
        --book-height: min(88dvh, calc(var(--book-width) * 0.75));
        width: var(--book-width);
        height: var(--book-height);
      }

      body.is-fullscreen.single-page .book-scene {
        --book-width: min(94vw, calc(88dvh * 0.67));
        --book-height: min(88dvh, calc(var(--book-width) * 1.5));
      }

      body.single-page {
        --book-width: min(97vw, 520px);
        --book-height: min(84dvh, calc(var(--book-width) * 1.5));
      }
    </style>
  </head>
  <body class="toons-reader">
    <a href="/experiments/" class="toons-back" title="Back to Experiments" aria-label="Back to Experiments">
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path d="M19 12H5M11 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </a>
    <div class="toon-top-controls">
      <button
        type="button"
        id="viewModeBtn"
        class="toon-fs-btn"
        aria-pressed="false"
        title="Switch to vertical scroll view"
        aria-label="Switch to vertical scroll view"
      >
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M4 6h16M4 12h16M4 18h10" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="toon-fs-label" id="viewModeLabel">Scroll</span>
      </button>
      <button
        type="button"
        id="fullscreenBtn"
        class="toon-fs-btn"
        aria-pressed="false"
        title="Fullscreen"
        aria-label="Enter fullscreen"
      >
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="toon-fs-label">Full</span>
      </button>
    </div>

    <main class="reader" id="main-content" role="main">
      <div class="book-scene">
        <div class="book-shadow"></div>
        <div class="book" id="book">
          <div class="spread" id="spread">
            <div class="page-slot left" id="slot-left"></div>
            <div class="page-slot right" id="slot-right"></div>
            <div class="spine-glow"></div>
            <div class="spine"></div>
            <div class="nav-zone next" id="zone-next" title="Next page"></div>
            <div class="nav-zone prev" id="zone-prev" title="Previous page"></div>
          </div>
        </div>
        <button
          class="reader-btn page-nav-btn prev"
          id="btn-prev"
          type="button"
          title="Previous page"
          aria-label="Previous page"
        >
          &#8592;
        </button>
        <button
          class="reader-btn page-nav-btn next"
          id="btn-next"
          type="button"
          title="Next page"
          aria-label="Next page"
        >
          &#8594;
        </button>
      </div>

      <div class="controls">
        <span class="page-indicator" id="indicator" aria-live="polite">…</span>
      </div>

      <div id="verticalStrip" class="vertical-strip" aria-label="Vertical page scroll" hidden></div>
    </main>

    <script src="../book-reader.js?v=2416b7d502"></script>
    <script src="../view-mode.js?v=73a009f9e0"></script>
    <script>
      ToonViewMode.init({
        altPrefix: "Erin",
        mobileDefault: true,
      });

      ToonBook.init({
        altPrefix: "Erin",
        frontCoverLogo: "../../logosquare.png",
        coverTexture: "/toons/assets/3d2d90aafc6ae28a9cb9f841a3b7183f.jpg",
      });
    </script>
  </body>
</html>
