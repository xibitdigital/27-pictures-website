<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Erin | Experiments | 27 Pictures</title>
    <meta name="description" content="Erin — an interactive page-turning manga reader from 27 Pictures Experiments." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://twentyseven.pictures/toons/erin/" />

    <link rel="icon" type="image/png" href="../../logosquare.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../../logosquare.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,900&family=Inter:wght@300;400;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../styles.css?v=179e55496f" />
    <link rel="stylesheet" href="../reader-shared.css?v=dbea354862" />
    <style>
      /* Book-only tokens (page paper / spine — not site chrome). Shared
         reader shell chrome lives in ../reader-shared.css; this block only
         has Erin's own book-aspect tokens. */
      :root {
        /* 240px ≈ title-bar + reader padding + controls row, so the book
           itself never forces the whole stack past the viewport height. */
        --book-width: min(92vw, 900px, calc((100dvh - 240px) / 0.72));
        --book-height: calc(var(--book-width) * 0.72);
        --page-bg: #f8f4ec;
        --spine: #2a2218;
        --cover: #111;
      }

      body.is-fullscreen .book-scene {
        --book-width: min(96vw, calc(92dvh * 1.35));
        --book-height: min(88dvh, calc(var(--book-width) * 0.72));
        width: var(--book-width);
        height: var(--book-height);
      }

      body.is-fullscreen.single-page .book-scene {
        --book-width: min(94vw, calc(88dvh * 0.67));
        --book-height: min(88dvh, calc(var(--book-width) * 1.5));
      }

      body.single-page {
        --book-width: min(97vw, 460px);
        --book-height: min(80dvh, calc(var(--book-width) * 1.5));
      }
    </style>
  </head>
  <body class="toons-reader">
    <div id="grain" aria-hidden="true"></div>

    <a href="/experiments/" class="toons-back" title="Back to Experiments" aria-label="Back to Experiments">
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path d="M19 12H5M11 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </a>
    <div class="toon-top-controls">
      <button
        type="button"
        id="fullscreenBtn"
        class="toon-fs-btn"
        aria-pressed="false"
        title="Fullscreen"
        aria-label="Enter fullscreen"
      >
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="toon-fs-label">Full</span>
      </button>
    </div>

    <main class="reader" id="main-content" role="main">
      <header class="title-bar">
        <p class="section-tag">Experiment</p>
        <h1>ERIN</h1>
      </header>

      <div class="book-scene">
        <div class="book-shadow"></div>
        <div class="book" id="book">
          <div class="spread" id="spread">
            <div class="page-slot left" id="slot-left"></div>
            <div class="page-slot right" id="slot-right"></div>
            <div class="spine-glow"></div>
            <div class="spine"></div>
            <div class="nav-zone next" id="zone-next" title="Next page"></div>
            <div class="nav-zone prev" id="zone-prev" title="Previous page"></div>
          </div>
        </div>
        <button
          class="reader-btn page-nav-btn prev"
          id="btn-prev"
          type="button"
          title="Previous page"
          aria-label="Previous page"
        >
          &#8592;
        </button>
        <button
          class="reader-btn page-nav-btn next"
          id="btn-next"
          type="button"
          title="Next page"
          aria-label="Next page"
        >
          &#8594;
        </button>
      </div>

      <div class="controls">
        <span class="page-indicator" id="indicator" aria-live="polite">…</span>
      </div>
    </main>

    <script src="../book-reader.js?v=129e50711a"></script>
    <script>
      ToonBook.init({ altPrefix: "Erin", frontCoverLogo: "../../logosquare.png" });
    </script>
  </body>
</html>
