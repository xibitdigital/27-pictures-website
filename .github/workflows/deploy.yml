# Build dist/ and deploy to Cloudflare Pages (not GitHub Pages).
#   staging → twentyseven-pictures-staging → https://staging.twentyseven.pictures
#   main    → twentyseven-pictures         → https://twentyseven.pictures
# Toon configs: publish every content/toons/*/config.json to R2 (config.<md5>.json)
# then build, so the lock in the JS matches this commit. Each toon keeps its own md5.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["main", "staging"]

  # Manual run from the Actions tab (uses the branch you pick)
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# One deploy at a time per branch; let in-progress ones finish.
concurrency:
  group: "cloudflare-pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      url: ${{ github.ref == 'refs/heads/main' && 'https://twentyseven.pictures' || 'https://staging.twentyseven.pictures' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Actions config
        env:
          VITE_ASSET_BASE: ${{ vars.VITE_ASSET_BASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=
          test -n "$VITE_ASSET_BASE" || missing="$missing VITE_ASSET_BASE (repo variable)"
          test -n "$CLOUDFLARE_API_TOKEN" || missing="$missing CLOUDFLARE_API_TOKEN (secret)"
          test -n "$CLOUDFLARE_ACCOUNT_ID" || missing="$missing CLOUDFLARE_ACCOUNT_ID (secret)"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions config:$missing"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Hash every content/toons/*/config.json, put new objects on R2, rewrite
      # config-lock.json in this job so the bundle below asks for those names.
      # Unchanged books keep their existing md5 (no R2 put).
      - name: Publish toon configs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run publish-toon-config -- --skip-unchanged

      - name: Build
        env:
          VITE_ASSET_BASE: ${{ vars.VITE_ASSET_BASE }}
        run: npm run build

      - name: Deploy to production (twentyseven-pictures)
        if: github.ref == 'refs/heads/main'
        id: deploy-prod
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.86.0"
          command: pages deploy dist --project-name=twentyseven-pictures --branch=main --commit-dirty=true

      - name: Deploy to staging (twentyseven-pictures-staging)
        if: github.ref == 'refs/heads/staging'
        id: deploy-staging
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.86.0"
          command: pages deploy dist --project-name=twentyseven-pictures-staging --branch=staging --commit-dirty=true

      # Unique <hash>.pages.dev URLs are the deployment itself. Keep the newest
      # (live custom domain) and delete superseded snapshots.
      - name: Prune old Pages deployments
        if: steps.deploy-prod.outcome == 'success' || steps.deploy-staging.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            npm run prune-pages-deployments -- --project twentyseven-pictures
          else
            npm run prune-pages-deployments -- --project twentyseven-pictures-staging
          fi

      - name: Summary
        if: steps.deploy-prod.outcome == 'success' || steps.deploy-staging.outcome == 'success'
        run: |
          {
            echo "## Cloudflare Pages"
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "- Site: https://twentyseven.pictures"
            else
              echo "- Site: https://staging.twentyseven.pictures (HTTP Basic Auth)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
