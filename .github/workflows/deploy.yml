# Build with Vite and deploy dist/ to Cloudflare Pages — the CI twin of
# `make deploy` (main → twentyseven-pictures) and `make preview-deploy`
# (staging → twentyseven-pictures-staging).
#
# This replaces the original GitHub Pages workflow, which uploaded raw public/
# — the site only exists after `vite build` (entries live in src/, locales are
# generated, CSS is hashed), so that copy 404'd at its root.
#
# Repository settings this needs (Settings → Secrets and variables → Actions):
#   secrets.CLOUDFLARE_API_TOKEN   — token with Account → Cloudflare Pages → Edit
#   secrets.CLOUDFLARE_ACCOUNT_ID  — 945bbed782b2b8b5b48ee399c561a071
#   vars.VITE_ASSET_BASE (optional) — overrides the r2.dev default below, e.g.
#                                     https://assets.twentyseven.pictures
#
# Until the secrets exist, the workflow still builds and tests every push but
# skips the deploy step with a warning — it cannot ship anything by accident.
#
# R2 media is NOT uploaded here: new plates/OG art still go up via
# `npm run upload-assets` (or `make ship`) BEFORE merging HTML that references
# them, exactly as the manual flow requires.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["main", "staging"]
  workflow_dispatch:

concurrency:
  group: cf-pages-${{ github.ref }}
  cancel-in-progress: false

env:
  VITE_ASSET_BASE: ${{ vars.VITE_ASSET_BASE || 'https://pub-e60c8fa8eea343fbac708bf75981d19c.r2.dev' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        # Staging builds get the short-SHA build id the cover shows, same as
        # `make preview-deploy` (the tree is clean in CI, so no timestamp).
        run: |
          if [ "$GITHUB_REF_NAME" = "staging" ]; then
            export VITE_FLIPFRAME_BUILD="${GITHUB_SHA::7}"
          fi
          npm run build

      - name: Skip deploy (no Cloudflare credentials)
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN secret not set — built and tested, deploy skipped."

      - name: Deploy production (twentyseven.pictures)
        if: github.ref_name == 'main' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler pages deploy dist --project-name=twentyseven-pictures --branch=main

      - name: Deploy staging (staging.twentyseven.pictures)
        if: github.ref_name == 'staging' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler pages deploy dist --project-name=twentyseven-pictures-staging --branch=staging
