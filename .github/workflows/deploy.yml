# Build the site and deploy dist/ to Cloudflare Pages.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["main", "staging"]

  # Allows manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time per branch; let in-progress ones finish.
concurrency:
  group: "cloudflare-pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_ASSET_BASE: ${{ vars.VITE_ASSET_BASE }}
        run: npm run build

      - name: Deploy to production (twentyseven-pictures)
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=twentyseven-pictures --branch=main --commit-dirty=true

      - name: Deploy to staging (twentyseven-pictures-staging)
        if: github.ref == 'refs/heads/staging'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=twentyseven-pictures-staging --branch=staging --commit-dirty=true
