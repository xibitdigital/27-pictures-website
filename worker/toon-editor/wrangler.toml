name = "toon-editor"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Origins whose browser calls are answered. Dev hosts are added in code
# (localhost / 127.0.0.1 / local.twentyseven.test) so `make dev` can write.
[vars]
ALLOWED_ORIGINS = "https://twentyseven.pictures,https://staging.twentyseven.pictures"
# JWT_SECRET is a wrangler secret (local: .dev.vars). Never put it here.
# Public CDN prefix for stored objects. Keys are `editor/<slug>/…`.
ASSET_BASE = "https://pub-e60c8fa8eea343fbac708bf75981d19c.r2.dev"
# Books that may receive likes even before they have a D1 `toons` row.
ALLOWED_TOONS = "erin,erin-the-revenge,jax,nero,redsmile-static,redsmile-marcus"
# Public Comfy Cloud API (not a secret). Override locally in .dev.vars.
COMFY_URL = "https://cloud.comfy.org/api"

# Staging and production share this D1 (one Worker). Local `wrangler dev`
# uses Miniflare. Do not add env-specific d1_databases.
[[d1_databases]]
binding = "DB"
database_name = "toon-editor"
database_id = "03050176-63bb-4f6a-bf07-56b319d0a516"
migrations_dir = "migrations"

# Same bucket the rest of the site uses (scripts/lib/r2-media.js).
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "twentyseven-assets"
