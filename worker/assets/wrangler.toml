name = "twentyseven-assets"
main = "src/index.ts"
compatibility_date = "2024-10-22"

# Same bucket as toon-editor and scripts/lib/r2-media.js. Public access can
# stay on until this Worker is VITE_ASSET_BASE; then disable the r2.dev URL.
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "twentyseven-assets"

# Custom domain (after CNAME assets → this Worker):
# routes = [{ pattern = "assets.twentyseven.pictures/*", zone_name = "twentyseven.pictures" }]
