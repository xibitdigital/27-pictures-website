      name="description"
      content="Nero — detective and Eve of Scotland Yard hunt The Dog, a sicario, and the conspiracy behind high-density implant tech. Interactive FlipFrame from 27 Pictures Experiments."

    <link rel="icon" type="image/png" href="/logosquare.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logosquare.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&family=VT323&family=Playfair+Display:ital,wght@0,900;1,900&family=Inter:wght@300;400;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css?v=cebaabb502" />
    <link rel="stylesheet" href="/toons/reader-shared.css?v=11d8c5052e" />
    <style>
      /* Book-only tokens — portrait pages (~800×1424). Shared shell chrome in reader-shared.css. */
      :root {
        /* Spread aspect ≈ 0.89 for two portrait pages (same family as Jax). */
        --book-width: min(calc(100vw - 64px), 1400px, calc((100dvh - 88px) / 0.89));
        --book-height: calc(var(--book-width) * 0.89);
        --page-bg: #0a0a0c;
        --spine: #1a1a22;
        --cover: #0a0a0c;
      }

      body.is-fullscreen .book-scene {
        --book-width: min(calc(100vw - 12px), calc(96dvh / 0.89));
        --book-height: min(94dvh, calc(var(--book-width) * 0.89));
        width: var(--book-width);
        height: var(--book-height);
      }

      body.is-fullscreen.single-page .book-scene {
        --book-width: min(97vw, calc(94dvh * 0.562));
        --book-height: min(94dvh, calc(var(--book-width) * 1.78));
      }

      body.single-page {
        --book-width: min(99vw, 620px);
        --book-height: min(90dvh, calc(var(--book-width) * 1.78));
      }
    </style>
  </head>
  <body class="toons-reader">
    <div id="app"></div>
    <script type="module" src="/toons/nero/main.ts"></script>
  </body>
</html>
