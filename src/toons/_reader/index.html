<!doctype html>
<html
  lang="en"
  data-toon-slug=""
  data-asset-page-dir=""
  data-paper="dark"
  style="--plate-w: 800; --plate-h: 1424; --spread-aspect: 0.89; --strip-cap: 800px"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Interactive Toon | 27 Pictures</title>
    <meta name="description" content="A FlipFrame interactive toon from 27 Pictures." />
    <link rel="canonical" href="https://twentyseven.pictures/toons/" />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:type" content="article" />
    <meta property="og:url" content="https://twentyseven.pictures/toons/" />
    <meta property="og:title" content="Interactive Toon | 27 Pictures" />
    <meta property="og:description" content="A FlipFrame interactive toon from 27 Pictures." />
    <meta property="og:image" content="%VITE_ASSET_BASE%/card-art/toons-og.jpg" />
    <meta property="og:site_name" content="27 Pictures" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Interactive Toon | 27 Pictures" />
    <meta name="twitter:description" content="A FlipFrame interactive toon from 27 Pictures." />
    <meta name="twitter:image" content="%VITE_ASSET_BASE%/card-art/toons-og.jpg" />
    <link rel="icon" type="image/png" href="/logosquare.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&family=VT323&family=Playfair+Display:ital,wght@0,900;1,900&family=Inter:wght@300;400;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/toons/reader-shared.css" />
    <style>
      :root {
        --book-width: min(calc(100vw - 64px), 1400px, calc((100dvh - 88px) / var(--spread-aspect)));
        --book-height: calc(var(--book-width) * var(--spread-aspect));
        --plate-aspect: var(--plate-w) / var(--plate-h);
        --strip-width: min(98vw, var(--strip-cap));
        --page-bg: #0a0a0c;
        --spine: #1a1a22;
        --cover: #0a0a0c;
      }
      html[data-paper="light"] {
        --page-bg: #f8f4ec;
        --spine: #2a2218;
        --cover: #111;
      }
      body.is-fullscreen .book-scene {
        --book-width: min(calc(100vw - 12px), calc(96dvh / var(--spread-aspect)));
        --book-height: min(94dvh, calc(var(--book-width) * var(--spread-aspect)));
        width: var(--book-width);
        height: var(--book-height);
      }
      body.is-fullscreen.single-page .book-scene {
        --book-width: min(97vw, calc(94dvh * 0.562));
        --book-height: min(94dvh, calc(var(--book-width) * 1.78));
      }
      body.single-page {
        --book-width: min(99vw, 620px);
        --book-height: min(90dvh, calc(var(--book-width) * 1.78));
      }
    </style>
    <script type="application/ld+json" data-toon-jsonld>
      { "@context": "https://schema.org", "@graph": [] }
    </script>
  </head>
  <body class="toons-reader">
    <nav class="page-breadcrumb" data-reader-trail hidden></nav>
    <div id="app">
      <article class="reader-fallback">
        <p class="reader-fallback-tag">Interactive toon</p>
        <h1>Interactive Toon</h1>
        <p>This is a FlipFrame reader. It needs JavaScript — the pages and audio stream from our CDN as you read.</p>
        <p><a href="/toons/">All interactive toons</a></p>
      </article>
    </div>
    <script type="application/json" data-episode-nav>
      null
    </script>
    <script type="module" src="/toons/_reader/main.ts"></script>
  </body>
</html>
