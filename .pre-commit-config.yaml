# Install both commit and push hooks: `pre-commit install` (see Makefile `install`).
default_install_hook_types: [pre-commit, pre-push]

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
    -   id: check-added-large-files
    -   id: check-ast
    -   id: check-case-conflict
    -   id: check-executables-have-shebangs
    -   id: check-json
    -   id: check-merge-conflict
    -   id: check-toml
    -   id: check-yaml
    -   id: debug-statements
    -   id: double-quote-string-fixer
    -   id: end-of-file-fixer
    -   id: trailing-whitespace

# Format on commit (auto-fix). Vue/TS included so the MPA stays consistent.
-   repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
    -   id: prettier
        name: prettier
        types_or: [html, css, javascript, json, vue, ts]
        args: [--write]
        stages: [pre-commit]

# Gate pushes: tests + production build (typecheck included via `npm run build`).
-   repo: local
    hooks:
    -   id: test-and-build
        name: npm test && npm run build
        entry: npm run check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
